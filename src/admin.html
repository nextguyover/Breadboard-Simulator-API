<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Breadboard Simulator admin</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
    --accent: #2563eb; --danger: #c62828; --chip: #eef1f5;
    --new: #2563eb; --triaged: #a16207; --fixed: #15803d; --wontfix: #6b7280; --duplicate: #7c3aed; --spam: #c62828;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #98a2b0; --line: #2a3039;
      --accent: #60a5fa; --danger: #f87171; --chip: #232932;
      --new: #60a5fa; --triaged: #facc15; --fixed: #4ade80; --wontfix: #9ca3af; --duplicate: #c4b5fd; --spam: #f87171;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; margin-right: auto; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--danger); }
  select, input, textarea { border: 1px solid var(--line); background: var(--bg); padding: 6px 8px; border-radius: 8px; }
  .split { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; min-height: calc(100vh - 58px); }
  .pane-list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 58px); }
  .item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 16px; background: transparent; }
  .item.active { background: var(--chip); }
  .item .meta { display: flex; gap: 8px; color: var(--muted); font-size: 13px; align-items: center; flex-wrap: wrap; }
  .item .sum { margin-top: 2px; overflow-wrap: anywhere; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-weight: 600; }
  .badge[data-s] { color: var(--c); } .badge[data-s="new"] { --c: var(--new); } .badge[data-s="triaged"] { --c: var(--triaged); }
  .badge[data-s="fixed"] { --c: var(--fixed); } .badge[data-s="wontfix"] { --c: var(--wontfix); }
  .badge[data-s="duplicate"] { --c: var(--duplicate); } .badge[data-s="spam"] { --c: var(--spam); }
  .pane-detail { padding: 20px 24px; overflow-y: auto; max-height: calc(100vh - 58px); }
  .pane-detail h2 { margin: 0 0 4px; font-size: 20px; }
  .desc { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 14px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; font-size: 13px; max-height: 360px; }
  img.shot { max-width: 100%; border: 1px solid var(--line); border-radius: 10px; display: block; margin: 14px 0; }
  .row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; margin: 14px 0; }
  .row textarea { flex: 1 1 260px; min-height: 38px; }
  .muted { color: var(--muted); }
  .more { margin: 12px 16px; }
  #login { max-width: 420px; margin: 12vh auto; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  #login input { width: 100%; margin: 12px 0; }
  .err { color: var(--danger); }
  a { color: var(--accent); }
  .tabs { display: flex; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px; }
  .tab { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); }
  .tab[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .spacer { margin-right: auto; }
  .launch { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .launch .muted { overflow-wrap: anywhere; }
  .launch .when { display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; }
  .launch .when span { color: var(--accent); font-size: 13px; }
  #vdetail .rows { max-height: none; }
  .check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
  .check[hidden] { display: none; }
  #analytics { padding: 20px 24px 40px; max-width: 1200px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  .card .hint { color: var(--muted); font-size: 13px; margin: -6px 0 10px; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart .grid { stroke: var(--line); }
  .chart .bar { fill: var(--accent); }
  .chart .bar:hover { opacity: .75; }
  .chart .line { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .rows { display: grid; gap: 6px; max-height: 420px; overflow-y: auto; }
  .hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 14px; }
  .hrow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .num { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  .hrow .track { grid-column: 1 / -1; height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .hrow .fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (max-width: 760px) { #analytics { padding: 16px; } .tile .value { font-size: 24px; } }
  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; }
    .pane-list { max-height: none; border-right: 0; }
    .pane-detail { max-height: none; padding: 16px; }
    .split.showing .pane-list { display: none; }
    .split:not(.showing) .pane-detail { display: none; }
  }
  .back { display: none; } @media (max-width: 760px) { .back { display: inline-block; margin-bottom: 12px; } }
</style>
</head>
<body>
<div id="login" hidden>
  <h1 style="font-size:18px;margin:0">Bug reports</h1>
  <p class="muted">Enter the admin token. It is kept in this browser only.</p>
  <form id="loginForm"><input id="token" type="password" autocomplete="current-password" placeholder="Admin token" required><button>Sign in</button></form>
  <p id="loginErr" class="err"></p>
</div>
<div id="app" hidden>
  <header>
    <nav class="tabs" aria-label="Sections">
      <button id="tabReports" class="tab" aria-pressed="true">Bug reports</button>
      <button id="tabAnalytics" class="tab" aria-pressed="false">Analytics</button>
      <button id="tabVisitors" class="tab" aria-pressed="false">Visitors</button>
    </nav>
    <span class="spacer"></span>
    <select id="filter" aria-label="Filter by status"></select>
    <select id="range" aria-label="Time range" hidden>
      <option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option><option value="365">Last year</option><option value="0">All time</option>
    </select>
    <label id="dcWrap" class="check" hidden><input id="hideDc" type="checkbox"> Hide datacenters</label>
    <button id="refresh">Refresh</button>
    <button id="logout">Sign out</button>
  </header>
  <section id="analytics" hidden></section>
  <main id="vmain" class="split" hidden>
    <section id="vlist" class="pane-list"></section>
    <section id="vdetail" class="pane-detail"><p class="muted">Select a visitor to see each of their launches.</p></section>
  </main>
  <main id="main" class="split">
    <section id="list" class="pane-list"></section>
    <section id="detail" class="pane-detail"><p class="muted">Select a report.</p></section>
  </main>
</div>
<script>
'use strict';
const APP_URL = __APP_URL__;
const STATUSES = ['new', 'triaged', 'fixed', 'wontfix', 'duplicate', 'spam'];
const $ = (id) => document.getElementById(id);
let token = '';
try { token = localStorage.getItem('bsimAdminToken') || ''; } catch {}
let current = null;
let shotUrl = null;

// Every value from a report is untrusted, so the page only ever sets textContent, never innerHTML.
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { Authorization: `Bearer ${token}`, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (res.status === 401) { showLogin('That token was not accepted.'); throw new Error('unauthorized'); }
  if (res.status === 429) {
    const mins = Math.ceil(Number(res.headers.get('Retry-After') || 60) / 60);
    showLogin(`Too many wrong tokens from this network. Try again in ${mins} minute${mins === 1 ? '' : 's'}.`);
    throw new Error('unauthorized');
  }
  if (!res.ok && res.status !== 204) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
  return res;
}

function showLogin(msg = '') {
  $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg; $('token').focus();
}

function fmtDate(iso) {
  return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

async function loadList(append = false) {
  const list = $('list');
  const status = $('filter').value;
  const before = append ? list.dataset.next : '';
  const q = new URLSearchParams({ limit: '50' });
  if (status) q.set('status', status);
  if (before) q.set('before', before);
  const data = await (await api(`/v1/reports?${q}`)).json();
  if (!append) list.replaceChildren();
  list.querySelector('.more')?.remove();
  renderFilter(data.counts);
  if (!data.reports.length && !append) list.append(el('p', { class: 'muted more', text: 'No reports.' }));
  for (const r of data.reports) {
    list.append(el('button', { class: 'item' + (current === r.id ? ' active' : ''), 'data-id': r.id, onclick: () => openReport(r.id) },
      el('div', { class: 'meta' },
        el('strong', { text: `#${r.id}` }), el('span', { class: 'badge', 'data-s': r.status, text: r.status }),
        el('span', { text: fmtDate(r.createdAt) }), el('span', { text: `v${r.appVersion}` }),
        r.hasScreenshot ? el('span', { text: '📷', title: 'Has screenshot' }) : null,
        r.hasCircuit ? el('span', { text: '🔌', title: 'Has circuit' }) : null,
        r.hasContact ? el('span', { text: '✉️', title: 'Left contact details' }) : null),
      el('div', { class: 'sum', text: r.summary })));
  }
  list.dataset.next = data.nextBefore ?? '';
  if (data.nextBefore) list.append(el('button', { class: 'more', text: 'Load more', onclick: () => loadList(true) }));
}

function renderFilter(counts = {}) {
  const f = $('filter');
  const value = f.value;
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  f.replaceChildren(el('option', { value: '', text: `All (${total})` }),
    ...STATUSES.map((s) => el('option', { value: s, text: `${s} (${counts[s] || 0})` })));
  f.value = value;
}

async function openReport(id) {
  current = id;
  for (const b of document.querySelectorAll('.item')) b.classList.toggle('active', Number(b.dataset.id) === id);
  $('main').classList.add('showing');
  const d = $('detail');
  d.replaceChildren(el('p', { class: 'muted', text: 'Loading…' }));
  const r = await (await api(`/v1/reports/${id}`)).json();
  if (shotUrl) { URL.revokeObjectURL(shotUrl); shotUrl = null; }

  const status = el('select', {}, ...STATUSES.map((s) => el('option', { value: s, text: s })));
  status.value = r.status;
  const note = el('textarea', { placeholder: 'Private note' }); note.value = r.note || '';
  const saveMsg = el('span', { class: 'muted' });

  const facts = [
    ['Received', fmtDate(r.createdAt)], ['App version', r.appVersion], ['Contact', r.contact || '—'],
    ['User agent', r.userAgent || '—'], ['Sender hash', r.ipHash || '—'],
  ];
  d.replaceChildren(
    el('button', { class: 'back', text: '← All reports', onclick: () => $('main').classList.remove('showing') }),
    el('h2', { text: `Report #${r.id}` }),
    el('div', { class: 'desc', text: r.description }),
    el('dl', {}, ...facts.flatMap(([k, v]) => [el('dt', { text: k }), el('dd', { text: v })])),
    r.circuit ? el('p', {}, el('a', { href: APP_URL + '#' + r.circuit, target: '_blank', rel: 'noopener noreferrer', text: 'Open the reported circuit in the app ↗' })) : null,
    el('div', { class: 'row' }, status, note,
      el('button', { text: 'Save', onclick: async () => {
        await api(`/v1/reports/${id}`, { method: 'PATCH', body: JSON.stringify({ status: status.value, note: note.value }) });
        saveMsg.textContent = 'Saved'; loadList();
      } }),
      el('button', { class: 'danger', text: 'Delete', onclick: async () => {
        if (!confirm(`Delete report #${id}? This cannot be undone.`)) return;
        await api(`/v1/reports/${id}`, { method: 'DELETE' });
        current = null; $('main').classList.remove('showing');
        d.replaceChildren(el('p', { class: 'muted', text: `Report #${id} deleted.` })); loadList();
      } }), saveMsg),
  );
  if (r.screenshotUrl) {
    const blob = await (await api(r.screenshotUrl)).blob();
    shotUrl = URL.createObjectURL(blob);
    d.append(el('h3', { text: 'Screenshot' }), el('img', { class: 'shot', src: shotUrl, alt: `Screenshot for report #${r.id}` }));
  }
  if (r.diagnostics) d.append(el('h3', { text: 'Diagnostics' }), el('pre', { text: JSON.stringify(r.diagnostics, null, 2) }));
}


// ---- Analytics ----
let view = 'reports';
const regionNames = (() => { try { return new Intl.DisplayNames(undefined, { type: 'region' }); } catch { return null; } })();
const fmtNum = (n) => Number(n).toLocaleString();
function countryLabel(code) {
  if (code === 'XX') return '🏳️ Unknown';
  if (code === 'T1') return '🧅 Tor';
  const flag = /^[A-Z]{2}$/.test(code) ? String.fromCodePoint(...[...code].map((c) => 0x1f1a5 + c.charCodeAt(0))) : '';
  let name = code;
  try { name = regionNames?.of(code) || code; } catch {}
  return `${flag} ${name}`;
}

function setView(v) {
  view = v;
  try { localStorage.setItem('bsimAdminView', v); } catch {}
  $('tabReports').setAttribute('aria-pressed', String(v === 'reports'));
  $('tabAnalytics').setAttribute('aria-pressed', String(v === 'analytics'));
  $('tabVisitors').setAttribute('aria-pressed', String(v === 'visitors'));
  $('main').hidden = v !== 'reports';
  $('filter').hidden = v !== 'reports';
  $('analytics').hidden = v !== 'analytics';
  $('vmain').hidden = v !== 'visitors';
  $('range').hidden = v === 'reports';
  $('dcWrap').hidden = v === 'reports';
  return refresh();
}

function refresh() {
  const load = view === 'analytics' ? loadAnalytics() : view === 'visitors' ? loadVisitors() : loadList();
  return load.catch((e) => { if (e.message !== 'unauthorized') alert(e.message); });
}

// ---- Visitors ----
// A visitor is a salted hash of IP address + browser, so a new network or browser shows up as a new visitor.
let currentVisitor = null;
const deviceIcon = (d) => (d === 'Mobile' ? '📱' : d === 'Tablet' ? '📲' : '🖥️');
const placeLabel = (r) => [r.city, r.region].filter(Boolean).concat(countryLabel(r.country || 'XX')).join(', ');
const networkText = (r) => (r.asn ? (r.datacenter ? `🏢 ${r.network} (AS${r.asn})` : `AS${r.asn}`) : 'Unknown network');
function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return 'just now';
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  if (s < 129600) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} days ago`;
}

// A time in the visitor's own timezone (from Cloudflare), or null when it isn't known.
function theirTime(iso, tz, withDate = true) {
  if (!tz) return null;
  try {
    return new Date(iso).toLocaleString(undefined, {
      timeZone: tz, timeZoneName: 'short', hour: 'numeric', minute: '2-digit',
      ...(withDate ? { month: 'short', day: 'numeric', year: 'numeric' } : {}),
    });
  } catch { return null; }
}
const yourTime = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

function visitorQuery(extra = {}) {
  const q = new URLSearchParams({ days: $('range').value, limit: '50', ...extra });
  if ($('hideDc').checked) q.set('hideDatacenter', '1');
  return q;
}

async function loadVisitors(append = false) {
  const list = $('vlist');
  const offset = append ? Number(list.dataset.offset || 0) : 0;
  const data = await (await api(`/v1/analytics/visitors?${visitorQuery({ offset: String(offset) })}`)).json();
  if (!append) list.replaceChildren(el('p', { class: 'muted more', text: `${fmtNum(data.total)} visitor${data.total === 1 ? '' : 's'} in this range` }));
  list.querySelector('button.more')?.remove();
  for (const v of data.visitors) {
    list.append(el('button', { class: 'item' + (currentVisitor === v.visitor ? ' active' : ''), 'data-id': v.visitor, onclick: () => openVisitor(v.visitor) },
      el('div', { class: 'meta' },
        el('span', { text: deviceIcon(v.device) }),
        el('strong', { text: `${v.device} · ${v.os} · ${v.browser}` }),
        v.datacenter ? el('span', { class: 'badge', 'data-s': 'spam', text: 'datacenter' }) : null),
      el('div', { class: 'sum', text: placeLabel(v) }),
      el('div', { class: 'meta' },
        el('span', { text: `${fmtNum(v.launches)} launch${v.launches === 1 ? '' : 'es'}` }),
        el('span', { text: `last ${ago(v.lastSeen)}` }),
        el('span', { text: `you ${new Date(v.lastSeen).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}` }),
        v.tz ? el('span', { text: `them ${theirTime(v.lastSeen, v.tz, false)}` }) : null,
        v.allTimeFirstSeen < v.firstSeen ? el('span', { text: `first seen ${fmtDate(v.allTimeFirstSeen)}` }) : null)));
  }
  list.dataset.offset = String(offset + data.visitors.length);
  if (offset + data.visitors.length < data.total) list.append(el('button', { class: 'more', text: 'Load more', onclick: () => loadVisitors(true) }));
}

async function openVisitor(id) {
  currentVisitor = id;
  for (const b of document.querySelectorAll('#vlist .item')) b.classList.toggle('active', b.dataset.id === id);
  $('vmain').classList.add('showing');
  const d = $('vdetail');
  d.replaceChildren(el('p', { class: 'muted', text: 'Loading…' }));
  const v = await (await api(`/v1/analytics/visitors/${id}`)).json();
  const real = v.launches.filter((l) => !l.bot);
  const latest = real[0] || v.launches[0];
  const facts = [
    ['Device', `${deviceIcon(latest.device)} ${latest.device}`], ['Operating system', latest.os], ['Browser', latest.browser],
    ['Location', placeLabel(latest)], ['Their timezone', latest.tz ? `${latest.tz} (now ${theirTime(new Date().toISOString(), latest.tz, false)})` : 'Unknown'],
    ['Network', networkText(latest)],
    ['Launches', fmtNum(real.length)], ['First seen', yourTime(v.launches[v.launches.length - 1].ts)], ['Last seen', yourTime(v.launches[0].ts)],
    ['Visitor ID', v.visitor],
  ];
  d.replaceChildren(
    el('button', { class: 'back', text: '← All visitors', onclick: () => $('vmain').classList.remove('showing') }),
    el('h2', { text: `${deviceIcon(latest.device)} ${latest.device} visitor` }),
    el('p', { class: 'muted', text: 'Identified by a hash of their IP address and browser; a new network or browser counts as a new visitor.' }),
    el('dl', {}, ...facts.flatMap(([k, val]) => [el('dt', { text: k }), el('dd', { text: val })])),
    el('h3', { text: `Launches (${fmtNum(v.launches.length)})` }),
    el('div', { class: 'rows' }, ...v.launches.map((l) => el('div', { class: 'launch' },
      el('div', { class: 'when' }, el('strong', { text: `${yourTime(l.ts)} your time` }),
        el('span', { text: theirTime(l.ts, l.tz) ? `their time ${theirTime(l.ts, l.tz)}` : 'their time unknown' })),
      el('span', { class: 'muted', text: [placeLabel(l), `${l.device} · ${l.os} · ${l.browser}`, networkText(l), l.bot ? 'verified bot (not counted)' : null].filter(Boolean).join(' · ') })))),
  );
}

const SVG = 'http://www.w3.org/2000/svg';
function svg(tag, attrs = {}, ...kids) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
}
// Axis top with 4 round steps (e.g. 0, 10, 20, 30, 40).
function niceMax(v) {
  const raw = Math.max(1, v / 4);
  const p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map((m) => m * p).find((m) => m >= raw && Number.isInteger(m));
  return Math.max(4, step * 4);
}

// Bars for launches with a dashed line for unique visitors.
function timeChart(points, W) {
  const H = W < 500 ? 180 : 220, L = 34, B = 22, T = 8;
  const labelEvery = Math.max(1, Math.ceil(points.length / Math.floor((W - L) / 64)));
  const max = niceMax(Math.max(1, ...points.map((p) => p.launches)));
  const step = (W - L) / Math.max(1, points.length);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const g = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Launches per day' });
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i;
    g.append(svg('line', { class: 'grid', x1: L, x2: W, y1: y(v), y2: y(v) }),
      svg('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }, fmtNum(v)));
  }
  points.forEach((p, i) => {
    const x = L + i * step;
    const bar = svg('rect', { class: 'bar', x: x + step * 0.15, width: Math.max(1, step * 0.7), y: y(p.launches), height: Math.max(0, y(0) - y(p.launches)), rx: Math.min(3, step * 0.2) },
      svg('title', {}, `${p.label}: ${fmtNum(p.launches)} launches, ${fmtNum(p.visitors)} visitors`));
    g.append(bar);
    if (i % labelEvery === 0) g.append(svg('text', { x: x + step / 2, y: H - 6, 'text-anchor': 'middle' }, p.short));
  });
  if (points.length > 1) {
    g.append(svg('polyline', { class: 'line', points: points.map((p, i) => `${L + i * step + step / 2},${y(p.visitors)}`).join(' ') }));
  }
  return g;
}

function hourChart(hours, W) {
  const H = 150, L = 34, B = 22, T = 8;
  const labelEvery = W < 500 ? 6 : 3;
  const counts = Array.from({ length: 24 }, (_, h) => hours.find((x) => x.hour === h)?.launches || 0);
  const max = niceMax(Math.max(1, ...counts));
  const step = (W - L) / 24;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const g = svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Launches by hour of day' });
  for (let i = 0; i <= 4; i += 2) {
    const v = (max / 4) * i;
    g.append(svg('line', { class: 'grid', x1: L, x2: W, y1: y(v), y2: y(v) }), svg('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }, fmtNum(v)));
  }
  counts.forEach((c, h) => {
    g.append(svg('rect', { class: 'bar', x: L + h * step + step * 0.15, width: step * 0.7, y: y(c), height: y(0) - y(c), rx: 2 },
      svg('title', {}, `${String(h).padStart(2, '0')}:00: ${fmtNum(c)} launches`)));
    if (h % labelEvery === 0) g.append(svg('text', { x: L + h * step + step / 2, y: H - 6, 'text-anchor': 'middle' }, `${String(h).padStart(2, '0')}h`));
  });
  return g;
}

function barList(rows, label, total) {
  if (!rows.length) return el('p', { class: 'muted', text: 'No data yet.' });
  const max = Math.max(...rows.map((r) => r.launches));
  return el('div', { class: 'rows' }, ...rows.map((r) => {
    const pct = total ? Math.round((r.launches / total) * 100) : 0;
    const fill = el('div', { class: 'fill' }); fill.style.width = `${(r.launches / max) * 100}%`;
    return el('div', { class: 'hrow', title: `${fmtNum(r.launches)} launches, ${fmtNum(r.visitors)} visitors` },
      el('span', { class: 'name', text: label(r) }),
      el('span', { class: 'num', text: `${fmtNum(r.launches)} · ${pct}%` }),
      el('div', { class: 'track' }, fill));
  }));
}

function networkLabel(r) {
  return r.datacenter ? `🏢 ${r.name} (AS${r.asn})` : `AS${r.asn}`;
}

function networksHint(t, hidden) {
  if (!t.withNetwork) return 'Add the Cloudflare rule from the README to see networks and filter out bots.';
  const parts = [];
  if (t.verifiedBots) parts.push(`${fmtNum(t.verifiedBots)} known bot launch${t.verifiedBots === 1 ? '' : 'es'} excluded`);
  if (t.datacenter) parts.push(`${fmtNum(t.datacenter)} from datacenters (🏢)${hidden ? ', hidden' : ''}`);
  return parts.length ? parts.join(' · ') + '.' : 'No bot or datacenter traffic in this range.';
}

function card(title, hint, body) {
  return el('div', { class: 'card' }, el('h3', { text: title }), hint ? el('p', { class: 'hint', text: hint }) : null, body);
}

function fillDays(daily, days) {
  const byDay = new Map(daily.map((d) => [d.day, d]));
  const today = new Date();
  const first = days > 0 ? new Date(today.getTime() - (days - 1) * 86400000) : daily.length ? new Date(daily[0].day + 'T12:00:00') : today;
  const out = [];
  for (let d = new Date(first.getFullYear(), first.getMonth(), first.getDate()); d <= today; d.setDate(d.getDate() + 1)) {
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const row = byDay.get(key) || { launches: 0, visitors: 0 };
    out.push({ label: d.toLocaleDateString(undefined, { dateStyle: 'medium' }), short: d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), launches: row.launches, visitors: row.visitors });
  }
  // Long ranges read better as weekly totals.
  if (out.length <= 120) return out;
  const weeks = [];
  for (let i = 0; i < out.length; i += 7) {
    const chunk = out.slice(i, i + 7);
    weeks.push({ label: `Week of ${chunk[0].label}`, short: chunk[0].short, launches: chunk.reduce((a, p) => a + p.launches, 0), visitors: chunk.reduce((a, p) => a + p.visitors, 0) });
  }
  return weeks;
}

let lastAnalytics = null;
async function loadAnalytics() {
  const days = Number($('range').value);
  const q = new URLSearchParams({ days: String(days), tz: String(-new Date().getTimezoneOffset()) });
  if ($('hideDc').checked) q.set('hideDatacenter', '1');
  lastAnalytics = { data: await (await api(`/v1/analytics?${q}`)).json(), days };
  renderAnalytics();
}

function renderAnalytics() {
  if (!lastAnalytics) return;
  const { data, days } = lastAnalytics;
  const a = $('analytics');
  // Charts are drawn at their real pixel width so text stays readable on phones.
  const chartW = Math.max(280, Math.min(1152, a.clientWidth - (a.clientWidth < 760 ? 32 : 48)) - 34);
  const t = data.totals;
  if (!t.launches) {
    a.replaceChildren(el('div', { class: 'empty' }, el('p', { text: 'No launches recorded in this range yet.' }),
      el('p', { class: 'muted', text: 'Each time someone opens the app it pings this service once, and that shows up here.' })));
    return;
  }
  const points = fillDays(data.daily, days);
  const weekly = points[0]?.label.startsWith('Week');
  const known = data.countries.filter((c) => c.key !== 'XX' && c.key !== 'T1').length;
  a.replaceChildren(
    el('div', { class: 'tiles' },
      ...[['Launches', t.launches], ['Unique visitors', t.visitors], ['Returning visitors', t.returningVisitors], ['Countries', known]]
        .map(([label, v]) => el('div', { class: 'tile' }, el('div', { class: 'label', text: label }), el('div', { class: 'value', text: fmtNum(v) })))),
    card(weekly ? 'Launches per week' : 'Launches per day', null, el('div', {},
      el('div', { class: 'legend' }, el('span', {}, el('i', { style: 'background:var(--accent)' }), 'Launches'),
        el('span', {}, el('i', { style: 'background:none;border-top:2px dashed var(--text);height:0;border-radius:0' }), 'Unique visitors')),
      timeChart(points, chartW))),
    el('div', { class: 'grid2' },
      card('Countries', null, barList(data.countries, (r) => countryLabel(r.key), t.launches)),
      card('Cities', data.cities.length ? null : 'Turn on Cloudflare’s "Add visitor location headers" managed transform to see cities.',
        barList(data.cities.map((c) => ({ ...c })), (r) => [r.city, r.region, countryLabel(r.country)].filter(Boolean).join(', '), t.launches))),
    el('div', { class: 'grid2' },
      card('Devices', null, barList(data.devices, (r) => r.key, t.launches)),
      card('Operating systems', null, barList(data.os, (r) => r.key, t.launches)),
      card('Browsers', null, barList(data.browsers, (r) => r.key, t.launches))),
    el('div', { class: 'grid2' }, card('Time of day', 'Your local time.', hourChart(data.hours, chartW))),
    el('div', { class: 'grid2' }, card('Networks', networksHint(t, data.hideDatacenter), barList(data.networks, networkLabel, t.launches))),
  );
}

$('tabReports').addEventListener('click', () => setView('reports'));
$('tabAnalytics').addEventListener('click', () => setView('analytics'));
$('tabVisitors').addEventListener('click', () => setView('visitors'));
$('range').addEventListener('change', () => refresh());
try { $('hideDc').checked = localStorage.getItem('bsimHideDc') === '1'; } catch {}
$('hideDc').addEventListener('change', () => {
  try { localStorage.setItem('bsimHideDc', $('hideDc').checked ? '1' : '0'); } catch {}
  refresh();
});
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (view === 'analytics') renderAnalytics(); }, 150);
});

async function start() {
  $('login').hidden = true; $('app').hidden = false;
  let saved = 'reports';
  try { saved = localStorage.getItem('bsimAdminView') || 'reports'; } catch {}
  await setView(['analytics', 'visitors'].includes(saved) ? saved : 'reports');
}

$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  token = $('token').value.trim();
  try { localStorage.setItem('bsimAdminToken', token); } catch {}
  start();
});
$('logout').addEventListener('click', () => { token = ''; try { localStorage.removeItem('bsimAdminToken'); } catch {} showLogin(); });
$('refresh').addEventListener('click', () => refresh());
$('filter').addEventListener('change', () => loadList());
renderFilter();
if (token) start(); else showLogin();
</script>
</body>
