<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bug reports</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
    --accent: #2563eb; --danger: #c62828; --chip: #eef1f5;
    --new: #2563eb; --triaged: #a16207; --fixed: #15803d; --wontfix: #6b7280; --duplicate: #7c3aed; --spam: #c62828;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #98a2b0; --line: #2a3039;
      --accent: #60a5fa; --danger: #f87171; --chip: #232932;
      --new: #60a5fa; --triaged: #facc15; --fixed: #4ade80; --wontfix: #9ca3af; --duplicate: #c4b5fd; --spam: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; margin-right: auto; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--danger); }
  select, input, textarea { border: 1px solid var(--line); background: var(--bg); padding: 6px 8px; border-radius: 8px; }
  main { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; min-height: calc(100vh - 58px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 58px); }
  .item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 16px; background: transparent; }
  .item.active { background: var(--chip); }
  .item .meta { display: flex; gap: 8px; color: var(--muted); font-size: 13px; align-items: center; flex-wrap: wrap; }
  .item .sum { margin-top: 2px; overflow-wrap: anywhere; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-weight: 600; }
  .badge[data-s] { color: var(--c); } .badge[data-s="new"] { --c: var(--new); } .badge[data-s="triaged"] { --c: var(--triaged); }
  .badge[data-s="fixed"] { --c: var(--fixed); } .badge[data-s="wontfix"] { --c: var(--wontfix); }
  .badge[data-s="duplicate"] { --c: var(--duplicate); } .badge[data-s="spam"] { --c: var(--spam); }
  #detail { padding: 20px 24px; overflow-y: auto; max-height: calc(100vh - 58px); }
  #detail h2 { margin: 0 0 4px; font-size: 20px; }
  .desc { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 14px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; font-size: 13px; max-height: 360px; }
  img.shot { max-width: 100%; border: 1px solid var(--line); border-radius: 10px; display: block; margin: 14px 0; }
  .row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; margin: 14px 0; }
  .row textarea { flex: 1 1 260px; min-height: 38px; }
  .muted { color: var(--muted); }
  .more { margin: 12px 16px; }
  #login { max-width: 420px; margin: 12vh auto; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  #login input { width: 100%; margin: 12px 0; }
  .err { color: var(--danger); }
  a { color: var(--accent); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    #list { max-height: none; border-right: 0; }
    #detail { max-height: none; padding: 16px; }
    main.showing #list { display: none; }
    main:not(.showing) #detail { display: none; }
  }
  .back { display: none; } @media (max-width: 760px) { .back { display: inline-block; margin-bottom: 12px; } }
</style>
</head>
<body>
<div id="login" hidden>
  <h1 style="font-size:18px;margin:0">Bug reports</h1>
  <p class="muted">Enter the admin token. It is kept in this browser only.</p>
  <form id="loginForm"><input id="token" type="password" autocomplete="current-password" placeholder="Admin token" required><button>Sign in</button></form>
  <p id="loginErr" class="err"></p>
</div>
<div id="app" hidden>
  <header>
    <h1>Bug reports</h1>
    <select id="filter" aria-label="Filter by status"></select>
    <button id="refresh">Refresh</button>
    <button id="logout">Sign out</button>
  </header>
  <main id="main">
    <section id="list"></section>
    <section id="detail"><p class="muted">Select a report.</p></section>
  </main>
</div>
<script>
'use strict';
const APP_URL = __APP_URL__;
const STATUSES = ['new', 'triaged', 'fixed', 'wontfix', 'duplicate', 'spam'];
const $ = (id) => document.getElementById(id);
let token = '';
try { token = localStorage.getItem('bsimAdminToken') || ''; } catch {}
let current = null;
let shotUrl = null;

// Every value from a report is untrusted, so the page only ever sets textContent, never innerHTML.
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { Authorization: `Bearer ${token}`, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (res.status === 401) { showLogin('That token was not accepted.'); throw new Error('unauthorized'); }
  if (!res.ok && res.status !== 204) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
  return res;
}

function showLogin(msg = '') {
  $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg; $('token').focus();
}

function fmtDate(iso) {
  return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

async function loadList(append = false) {
  const list = $('list');
  const status = $('filter').value;
  const before = append ? list.dataset.next : '';
  const q = new URLSearchParams({ limit: '50' });
  if (status) q.set('status', status);
  if (before) q.set('before', before);
  const data = await (await api(`/v1/reports?${q}`)).json();
  if (!append) list.replaceChildren();
  list.querySelector('.more')?.remove();
  renderFilter(data.counts);
  if (!data.reports.length && !append) list.append(el('p', { class: 'muted more', text: 'No reports.' }));
  for (const r of data.reports) {
    list.append(el('button', { class: 'item' + (current === r.id ? ' active' : ''), 'data-id': r.id, onclick: () => openReport(r.id) },
      el('div', { class: 'meta' },
        el('strong', { text: `#${r.id}` }), el('span', { class: 'badge', 'data-s': r.status, text: r.status }),
        el('span', { text: fmtDate(r.createdAt) }), el('span', { text: `v${r.appVersion}` }),
        r.hasScreenshot ? el('span', { text: '📷', title: 'Has screenshot' }) : null,
        r.hasCircuit ? el('span', { text: '🔌', title: 'Has circuit' }) : null,
        r.hasContact ? el('span', { text: '✉️', title: 'Left contact details' }) : null),
      el('div', { class: 'sum', text: r.summary })));
  }
  list.dataset.next = data.nextBefore ?? '';
  if (data.nextBefore) list.append(el('button', { class: 'more', text: 'Load more', onclick: () => loadList(true) }));
}

function renderFilter(counts = {}) {
  const f = $('filter');
  const value = f.value;
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  f.replaceChildren(el('option', { value: '', text: `All (${total})` }),
    ...STATUSES.map((s) => el('option', { value: s, text: `${s} (${counts[s] || 0})` })));
  f.value = value;
}

async function openReport(id) {
  current = id;
  for (const b of document.querySelectorAll('.item')) b.classList.toggle('active', Number(b.dataset.id) === id);
  $('main').classList.add('showing');
  const d = $('detail');
  d.replaceChildren(el('p', { class: 'muted', text: 'Loading…' }));
  const r = await (await api(`/v1/reports/${id}`)).json();
  if (shotUrl) { URL.revokeObjectURL(shotUrl); shotUrl = null; }

  const status = el('select', {}, ...STATUSES.map((s) => el('option', { value: s, text: s })));
  status.value = r.status;
  const note = el('textarea', { placeholder: 'Private note' }); note.value = r.note || '';
  const saveMsg = el('span', { class: 'muted' });

  const facts = [
    ['Received', fmtDate(r.createdAt)], ['App version', r.appVersion], ['Contact', r.contact || '—'],
    ['User agent', r.userAgent || '—'], ['Sender hash', r.ipHash || '—'],
  ];
  d.replaceChildren(
    el('button', { class: 'back', text: '← All reports', onclick: () => $('main').classList.remove('showing') }),
    el('h2', { text: `Report #${r.id}` }),
    el('div', { class: 'desc', text: r.description }),
    el('dl', {}, ...facts.flatMap(([k, v]) => [el('dt', { text: k }), el('dd', { text: v })])),
    r.circuit ? el('p', {}, el('a', { href: APP_URL + '#' + r.circuit, target: '_blank', rel: 'noopener noreferrer', text: 'Open the reported circuit in the app ↗' })) : null,
    el('div', { class: 'row' }, status, note,
      el('button', { text: 'Save', onclick: async () => {
        await api(`/v1/reports/${id}`, { method: 'PATCH', body: JSON.stringify({ status: status.value, note: note.value }) });
        saveMsg.textContent = 'Saved'; loadList();
      } }),
      el('button', { class: 'danger', text: 'Delete', onclick: async () => {
        if (!confirm(`Delete report #${id}? This cannot be undone.`)) return;
        await api(`/v1/reports/${id}`, { method: 'DELETE' });
        current = null; $('main').classList.remove('showing');
        d.replaceChildren(el('p', { class: 'muted', text: `Report #${id} deleted.` })); loadList();
      } }), saveMsg),
  );
  if (r.screenshotUrl) {
    const blob = await (await api(r.screenshotUrl)).blob();
    shotUrl = URL.createObjectURL(blob);
    d.append(el('h3', { text: 'Screenshot' }), el('img', { class: 'shot', src: shotUrl, alt: `Screenshot for report #${r.id}` }));
  }
  if (r.diagnostics) d.append(el('h3', { text: 'Diagnostics' }), el('pre', { text: JSON.stringify(r.diagnostics, null, 2) }));
}

async function start() {
  $('login').hidden = true; $('app').hidden = false;
  try { await loadList(); } catch (e) { if (e.message !== 'unauthorized') alert(e.message); }
}

$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  token = $('token').value.trim();
  try { localStorage.setItem('bsimAdminToken', token); } catch {}
  start();
});
$('logout').addEventListener('click', () => { token = ''; try { localStorage.removeItem('bsimAdminToken'); } catch {} showLogin(); });
$('refresh').addEventListener('click', () => loadList());
$('filter').addEventListener('change', () => loadList());
renderFilter();
if (token) start(); else showLogin();
</script>
</body>
</html>
